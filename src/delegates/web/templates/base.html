<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Debate study{% endblock %}</title>
<style>
  :root {
    --ink: #16181d; --muted: #5f6673; --line: #dfe2e8; --bg: #f7f8fa;
    --card: #ffffff; --accent: #2f5d9e; --accent-soft: #e8eef8;
    --them: #f0f1f4; --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 32px 20px 96px; }
  h1 { font-size: 24px; line-height: 1.3; margin: 0 0 8px; }
  h2 { font-size: 17px; margin: 28px 0 10px; }
  p { margin: 0 0 14px; }
  .muted { color: var(--muted); font-size: 14px; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 20px 22px; margin-bottom: 18px;
  }
  .prop {
    background: var(--accent-soft); border: 1px solid #cfdcef;
    border-radius: var(--radius); padding: 14px 16px; margin-bottom: 18px;
  }
  .prop strong { display: block; font-size: 13px; text-transform: uppercase;
    letter-spacing: .06em; color: var(--accent); margin-bottom: 4px; }
  .turn { margin-bottom: 16px; }
  .turn .who { font-size: 12px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--muted); margin-bottom: 5px; }
  .bubble { padding: 13px 16px; border-radius: var(--radius); white-space: pre-wrap; }
  .them .bubble { background: var(--them); }
  .me .bubble { background: var(--accent-soft); }
  textarea {
    width: 100%; min-height: 130px; padding: 12px; font: inherit;
    border: 1px solid var(--line); border-radius: var(--radius); resize: vertical;
    background: #fff;
  }
  textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button, .btn {
    font: inherit; cursor: pointer; border: 1px solid var(--line);
    background: #fff; border-radius: 8px; padding: 9px 16px;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: #27507f; }
  .scale { display: flex; gap: 5px; flex-wrap: wrap; margin: 10px 0 4px; }
  .scale button { flex: 1 1 auto; min-width: 42px; padding: 11px 0; }
  .scale button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .ends { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
  .conf-row { opacity: .35; pointer-events: none; transition: opacity .15s; }
  .conf-row.live { opacity: 1; pointer-events: auto; }
  .conf-row .scale button { min-width: 0; font-size: 14px; }
  .progress { font-size: 13px; color: var(--muted); margin-bottom: 14px; }
  .busy { opacity: .5; pointer-events: none; }
  .thinking { color: var(--muted); font-style: italic; padding: 14px 0; }
  .field { margin-bottom: 18px; }
  .field label.q { display: block; font-weight: 600; margin-bottom: 8px; }
  .opts { display: flex; gap: 8px; flex-wrap: wrap; }
  .opts label {
    border: 1px solid var(--line); background: #fff; border-radius: 8px;
    padding: 8px 13px; cursor: pointer; font-size: 15px;
  }
  .opts input { margin-right: 6px; }
  ul.plain { padding-left: 20px; }
  ul.plain li { margin-bottom: 6px; }
</style>
</head>
<body>
<div class="wrap">{% block body %}{% endblock %}</div>
<script src="/static/app.js"></script>
</body>
</html>
